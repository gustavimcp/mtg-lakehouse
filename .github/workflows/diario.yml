name: pipeline-diario

on:
  schedule:
    # A Scryfall gera o bulk data por volta de 09:00 UTC. 11:17 UTC = 08:17 em Brasília.
    # (minuto "quebrado" porque o GitHub atrasa jobs agendados na virada da hora)
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Baixar de novo mesmo se o snapshot do dia já estiver no lake"
        type: boolean
        default: false

# Nunca duas execuções ao mesmo tempo (equivale ao max_active_runs=1 do Airflow)
concurrency:
  group: pipeline-diario
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MTG_LAKE: ${{ vars.MTG_LAKE }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_URL_STYLE: ${{ vars.S3_URL_STYLE }}
      SCRYFALL_USER_AGENT: ${{ vars.SCRYFALL_USER_AGENT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Conferir configuração
        run: |
          case "$MTG_LAKE" in
            s3://*) echo "Lake: $MTG_LAKE" ;;
            *) echo "::error::Cadastre a variable MTG_LAKE (ex.: s3://mtg-lake) em Settings > Secrets and variables > Actions"; exit 1 ;;
          esac

      - name: Extrair (Scryfall -> bronze)
        run: python -m mtg_lake extrair ${{ inputs.forcar && '--forcar' || '' }}

      - name: Transformar e testar (dbt build)
        run: python -m mtg_lake transformar

      - name: Publicar (gold -> Parquet)
        run: python -m mtg_lake publicar

      - name: Retenção da camada bronze
        run: python -m mtg_lake limpar

      - name: Resumo
        if: always()
        run: |
          echo "### Pipeline MTG" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/estado.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "{}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs do dbt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs-${{ github.run_id }}
          path: |
            dbt/logs/
            dbt/target/run_results.json
          retention-days: 14
          if-no-files-found: ignore
