name: ci

# Roda a cada push/PR: lint + testes de ponta a ponta com a amostra em tests/fixtures
# (sem internet e sem credenciais; o lake é uma pasta temporária)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check mtg_lake tests
      - run: ruff format --check mtg_lake tests
      - run: pytest
